<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визитки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <div class="container py-5">
        <h1 class="display-4 text-center mb-2">Визитки</h1>
        <div class="row justify-content-center">
            <div class="col-xl-5 col-lg-6 col-md-8">
                <div class="card border-0 shadow">
                    <div class="card-header bg-dark text-white py-3">
                        Параметры заказа
                    </div>

                    <div class="card-body p-4">
                        <form id="form">
                            <div class="mb-3">
                                <label for="qty" class="form-label">Тираж, шт.</label>
                                <input type="number" id="qty" class="form-control"
                                       value="90" min="30" step="30">
                            </div>

                            <div class="mb-3">
                                <label for="paper" class="form-label">Бумага</label>
                                <select id="paper" class="form-select"></select>
                            </div>

                            <div class="mb-3">
                                <label for="color" class="form-label">Печать</label>
                                <select id="color" class="form-select"></select>
                            </div>
                        </form>

                        <div class="alert alert-success d-flex justify-content-between align-items-center mt-4 mb-0">
                            <span class="fw-semibold">Итого:</span>
                            <span class="display-6 m-0"><span id="price">0</span> ₽</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
